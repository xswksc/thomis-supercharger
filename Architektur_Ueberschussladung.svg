<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1240" height="780" fill="#ffffff"/>

  <!-- Titel -->
  <text x="40" y="48" font-size="26" font-weight="bold" fill="#0f172a">Systemarchitektur: PV-Überschussladung</text>
  <text x="40" y="76" font-size="14" fill="#475569">Tesla · SolarEdge · go-e / SolarEdge Wallbox · RFID · ein Ladepunkt, lokal betrieben</text>

  <!-- Gruppe Energieanlage -->
  <rect x="30" y="110" width="270" height="460" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="138" font-size="13" font-weight="bold" fill="#64748b" letter-spacing="0.5">ENERGIEANLAGE</text>

  <rect x="55" y="160" width="220" height="90" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="72" y="190" font-size="12" font-weight="bold" fill="#0f172a">SolarEdge Wechselrichter</text>
  <text x="72" y="212" font-size="12" fill="#475569">PV-Erzeugung · SunSpec</text>
  <text x="72" y="233" font-size="11.5" fill="#64748b">Modbus TCP · Unit-ID 1</text>

  <rect x="55" y="280" width="220" height="90" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="72" y="310" font-size="14" font-weight="bold" fill="#0f172a">Netz-Zähler</text>
  <text x="72" y="332" font-size="12" fill="#475569">SolarEdge oder Shelly Pro 3EM</text>
  <text x="72" y="353" font-size="11.5" fill="#64748b">Modbus TCP oder HTTP</text>

  <rect x="55" y="400" width="220" height="90" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="72" y="430" font-size="14" font-weight="bold" fill="#0f172a">Hausverbrauch &amp; Batterie</text>
  <text x="72" y="452" font-size="12" fill="#475569">berechnet aus PV, Netz, Last</text>
  <text x="72" y="473" font-size="11.5" fill="#64748b">optional: Shelly-Untermessung</text>

  <text x="45" y="522" font-size="11" fill="#b45309" font-weight="bold">Wichtig: nur ein Modbus-TCP-Client</text>
  <text x="45" y="540" font-size="11" fill="#92400e">gleichzeitig (SetApp, Home Assistant u. a.</text>
  <text x="45" y="556" font-size="11" fill="#92400e">beachten) – sonst Aussetzer.</text>

  <!-- Gruppe Controller -->
  <rect x="330" y="110" width="430" height="590" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="348" y="138" font-size="13" font-weight="bold" fill="#1d4ed8" letter-spacing="0.5">THOMIS SUPERCHARGER · PVE 9.1.6 (LXC)</text>

  <rect x="355" y="160" width="380" height="165" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="374" y="196" font-size="17" font-weight="bold" fill="#0f172a">Regelungskern</text>
  <text x="374" y="224" font-size="12.5" fill="#1e3a8a">Überschussregelung · Phasen · Ladegrenzen</text>
  <text x="374" y="248" font-size="12.5" fill="#1e3a8a">Modbus-Master · HTTP/OCPP</text>
  <text x="374" y="272" font-size="12.5" fill="#1e3a8a">Watchdog &amp; Fail-Safe</text>
  <text x="374" y="296" font-size="11" fill="#475569">einzige Instanz, die die Wallbox steuert</text>
  <text x="374" y="314" font-size="9.5" fill="#64748b">Basis: evcc (Open Source)</text>

  <rect x="355" y="380" width="380" height="120" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="374" y="412" font-size="15" font-weight="bold" fill="#0f172a">Thomis Supercharger (Eigenentwicklung)</text>
  <text x="374" y="440" font-size="12.5" fill="#4c1d95">RFID → Nutzer · Sessions · Budgets</text>
  <text x="374" y="464" font-size="12.5" fill="#4c1d95">Auswertung · REST/MQTT · Audit-Log</text>
  <text x="374" y="487" font-size="11" fill="#475569">setzt nur den Lademodus, nie den Strom</text>

  <rect x="380" y="560" width="160" height="60" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="396" y="585" font-size="13" font-weight="bold" fill="#0f172a">SQLite</text>
  <text x="396" y="605" font-size="10.5" fill="#475569">Nutzer · Karten · Sessions</text>

  <rect x="575" y="560" width="160" height="60" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="591" y="585" font-size="13" font-weight="bold" fill="#0f172a">Web-UI</text>
  <text x="591" y="605" font-size="10.5" fill="#475569">HTTPS · Charts · Export</text>

  <!-- Gruppe Ladepunkt -->
  <rect x="800" y="110" width="410" height="460" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="818" y="138" font-size="13" font-weight="bold" fill="#15803d" letter-spacing="0.5">LADEPUNKT</text>

  <rect x="825" y="160" width="360" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="843" y="192" font-size="15" font-weight="bold" fill="#0f172a">Wallbox (11 / 22 kW)</text>
  <text x="843" y="216" font-size="12" fill="#14532d">go-e: HTTP v2 · acs · rde</text>
  <text x="843" y="239" font-size="12" fill="#14532d">SolarEdge: OCPP 1.6J · RFID</text>

  <rect x="825" y="410" width="360" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="843" y="440" font-size="15" font-weight="bold" fill="#0f172a">RFID-Netzwerkleser</text>
  <text x="843" y="463" font-size="12" fill="#78350f">ESP32 + PN532 · MQTT/HTTP</text>
  <text x="843" y="481" font-size="11.5" fill="#92400e">kein USB · UID als HMAC</text>

  <rect x="825" y="300" width="360" height="90" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text x="843" y="331" font-size="15" font-weight="bold" fill="#0f172a">Tesla Model 3 / Y</text>
  <text x="843" y="354" font-size="12" fill="#881337">AC 11 kW · 1- und 3-phasig</text>
  <text x="843" y="375" font-size="11.5" fill="#9f1239">SoC optional über Tesla Fleet API</text>

  <!-- Browser -->
  <rect x="825" y="640" width="360" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="843" y="670" font-size="14" font-weight="bold" fill="#0f172a">Browser / Smartphone</text>
  <text x="843" y="692" font-size="11.5" fill="#475569">Freigaben, Historie, Auswertung – per VPN</text>

  <!-- Verbindungen -->
  <line x1="275" y1="205" x2="355" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="194" font-size="11" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">Modbus TCP</text>

  <line x1="275" y1="300" x2="355" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="289" font-size="11" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">Modbus/HTTP</text>

  <line x1="735" y1="215" x2="825" y2="215" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/>
  <text x="780" y="203" font-size="11" fill="#1d4ed8" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">HTTP / OCPP</text>

  <line x1="545" y1="380" x2="545" y2="310" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="556" y="349" font-size="11" fill="#5b21b6" paint-order="stroke" stroke="#ffffff" stroke-width="4">REST / MQTT</text>

  <line x1="825" y1="450" x2="735" y2="450" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="780" y="440" font-size="11" fill="#92400e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">MQTT</text>

  <line x1="1005" y1="260" x2="1005" y2="300" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1015" y="284" font-size="11" fill="#166534" paint-order="stroke" stroke="#ffffff" stroke-width="4">AC + CP</text>

  <line x1="470" y1="500" x2="470" y2="560" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="640" y1="500" x2="640" y2="560" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>

  <line x1="655" y1="620" x2="825" y2="673" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowGrey)"/>
  <text x="720" y="634" font-size="11" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="4">HTTPS</text>

  <!-- Legende -->
  <line x1="40" y1="732" x2="80" y2="732" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="90" y="736" font-size="11" fill="#475569">Messung / Steuerung</text>
  <line x1="250" y1="732" x2="290" y2="732" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="300" y="736" font-size="11" fill="#475569">optional / Benutzerzugriff</text>
  <text x="1185" y="736" font-size="11" fill="#94a3b8" text-anchor="end">Stand 29.10.2026 · Vorschlag</text>
</svg>
